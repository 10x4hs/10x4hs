<svg xmlns="http://www.w3.org/2000/svg" width="880" height="300" viewBox="0 0 880 300" role="img" aria-labelledby="t">
  <title id="t">Now to Next. Now: Daejeon and Seoul, 140 km apart. Next: San Francisco, this year (goal). 9,029 km. I am starting my company in Silicon Valley.</title>
  <defs>
    <pattern id="dots" width="10" height="17.32" patternUnits="userSpaceOnUse">
      <circle cx="2.5" cy="4.33" r="1.2" fill="#fff"/>
      <circle cx="7.5" cy="12.99" r="1.2" fill="#fff"/>
    </pattern>
    <mask id="dotMask"><rect width="880" height="300" fill="url(#dots)"/></mask>
    <radialGradient id="blue" r=".5"><stop offset="0" stop-color="#2f5bff"/><stop offset=".6" stop-color="#132a6b" stop-opacity=".5"/><stop offset="1" stop-color="#000" stop-opacity="0"/></radialGradient>
    <radialGradient id="ember" r=".5"><stop offset="0" stop-color="#ff7a2f"/><stop offset=".55" stop-color="#7a2a10" stop-opacity=".5"/><stop offset="1" stop-color="#000" stop-opacity="0"/></radialGradient>
    <linearGradient id="arc" x1="0" x2="1"><stop offset="0" stop-color="#2f5bff"/><stop offset=".6" stop-color="#e9c46a"/><stop offset="1" stop-color="#ff7a2f"/></linearGradient>
    <linearGradient id="silver" x1="0" x2="1">
      <stop offset="0" stop-color="#eceef1"/><stop offset=".36" stop-color="#c9ccd1"/><stop offset=".68" stop-color="#a7abb3"/><stop offset="1" stop-color="#dcdee2"/>
    </linearGradient>
    <clipPath id="card"><rect width="880" height="300" rx="22"/></clipPath>
    <style>
      .sans { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Helvetica Neue", Helvetica, Arial, sans-serif; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
      .draw { stroke-dasharray: 760; stroke-dashoffset: 760; animation: draw 2.2s cubic-bezier(.28,.11,.32,1) .4s forwards; }
      @keyframes draw { to { stroke-dashoffset: 0 } }
      .flow { stroke-dasharray: 2 12; animation: flow 1.4s linear infinite; opacity: 0; animation: flow 1.4s linear infinite, show .6s ease 2.4s forwards; }
      @keyframes flow { to { stroke-dashoffset: -28 } }
      @keyframes show { to { opacity: .9 } }
      .ring { transform-origin: 744px 168px; opacity: 0; animation: ring 3s cubic-bezier(.28,.11,.32,1) infinite; }
      .r2 { animation-delay: 1s } .r3 { animation-delay: 2s }
      @keyframes ring { from { opacity: .9; transform: scale(1) } to { opacity: 0; transform: scale(4.2) } }
      .mote { transform-origin: 744px 168px; opacity: 0; animation: mote 2.6s ease-out infinite; }
      @keyframes mote { 0% { opacity: 0; transform: rotate(var(--a)) translateX(6px) } 12% { opacity: 1 } 100% { opacity: 0; transform: rotate(var(--a)) translateX(46px) scale(.5) } }
      .comet { offset-path: path("M136 168 C 320 40, 560 40, 744 168"); animation: comet 4.5s cubic-bezier(.28,.11,.32,1) 2.6s infinite; opacity: 0; }
      @keyframes comet { 0% { offset-distance: 0%; opacity: 0 } 10% { opacity: 1 } 90% { opacity: 1 } 100% { offset-distance: 100%; opacity: 0 } }
      .in { opacity: 0; animation: appear 1s cubic-bezier(.28,.11,.32,1) forwards; }
      @keyframes appear { from { opacity: 0; transform: translateY(12px) } to { opacity: 1; transform: none } }
      .d1 { animation-delay: .1s } .d2 { animation-delay: .5s } .d3 { animation-delay: 2.2s } .d4 { animation-delay: 2.6s }
      @media (prefers-reduced-motion: reduce) {
        .draw { animation: none; stroke-dashoffset: 0 } .flow, .ring, .mote, .comet { animation: none } .in { animation: none; opacity: 1 }
      }
    </style>
  </defs>
  <g clip-path="url(#card)">
    <rect width="880" height="300" fill="#040a16"/>
    <g mask="url(#dotMask)">
      <ellipse cx="136" cy="230" rx="300" ry="190" fill="url(#blue)"/>
      <ellipse cx="760" cy="200" rx="300" ry="200" fill="url(#ember)"/>
    </g>

    <text x="44" y="58" class="mono in d1" font-size="11" letter-spacing="2" fill="#8b8b90">NOW → NEXT</text>
    <text x="836" y="58" text-anchor="end" class="mono in d1" font-size="11" letter-spacing="2" fill="#8b8b90">9,029 KM</text>

    <path class="draw" d="M136 168 C 320 40, 560 40, 744 168" fill="none" stroke="url(#arc)" stroke-width="1.6" stroke-opacity=".55"/>
    <path class="flow" d="M136 168 C 320 40, 560 40, 744 168" fill="none" stroke="#fff" stroke-width="2"/>
    <circle class="comet" r="3" fill="#fff"/>

    <!-- now -->
    <circle cx="136" cy="168" r="5" fill="#2f5bff"/>
    <circle cx="136" cy="168" r="10" fill="none" stroke="#2f5bff" stroke-opacity=".4"/>

    <!-- next: rings and motes, as on the site's San Francisco marker -->
    <circle class="ring"    cx="744" cy="168" r="6" fill="none" stroke="#ff7a2f" stroke-width="1.2"/>
    <circle class="ring r2" cx="744" cy="168" r="6" fill="none" stroke="#e9c46a" stroke-width="1.2"/>
    <circle class="ring r3" cx="744" cy="168" r="6" fill="none" stroke="#ff7a2f" stroke-width="1.2"/>
    <g fill="#e9c46a">
      <circle class="mote" style="--a:0deg;animation-delay:0s"     cx="744" cy="168" r="1.6"/>
      <circle class="mote" style="--a:60deg;animation-delay:.4s"   cx="744" cy="168" r="1.3"/>
      <circle class="mote" style="--a:120deg;animation-delay:.9s"  cx="744" cy="168" r="1.6"/>
      <circle class="mote" style="--a:180deg;animation-delay:1.3s" cx="744" cy="168" r="1.2"/>
      <circle class="mote" style="--a:240deg;animation-delay:1.7s" cx="744" cy="168" r="1.5"/>
      <circle class="mote" style="--a:300deg;animation-delay:2.1s" cx="744" cy="168" r="1.3"/>
    </g>
    <circle cx="744" cy="168" r="6" fill="#ff7a2f"/>

    <g class="in d2">
      <text x="136" y="208" text-anchor="middle" class="sans" font-size="18" font-weight="600" fill="#f5f5f7">Daejeon · Seoul</text>
      <text x="136" y="230" text-anchor="middle" class="mono" font-size="10.5" letter-spacing="1.6" fill="#8b8b90">NOW · 140 KM APART</text>
    </g>
    <g class="in d3">
      <text x="744" y="208" text-anchor="middle" class="sans" font-size="18" font-weight="600" fill="#f5f5f7">San Francisco</text>
      <text x="744" y="230" text-anchor="middle" class="mono" font-size="10.5" letter-spacing="1.6" fill="#8b8b90">NEXT · THIS YEAR (GOAL)</text>
    </g>

    <text x="440" y="274" text-anchor="middle" class="sans in d4" font-size="20" font-weight="600" letter-spacing="-.4" fill="url(#silver)">I am starting my company in Silicon Valley.</text>
  </g>
  <rect x=".5" y=".5" width="879" height="299" rx="22" fill="none" stroke="#fff" stroke-opacity=".1"/>
</svg>
