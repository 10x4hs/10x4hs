<svg xmlns="http://www.w3.org/2000/svg" width="880" height="200" viewBox="0 0 880 200" role="img" aria-labelledby="t">
  <title id="t">Now: Daejeon · Seoul. Next: San Francisco, this year (goal). 9,029 km.</title>
  <defs>
    <pattern id="dots" width="8" height="8" patternUnits="userSpaceOnUse">
      <circle cx="4" cy="4" r="1" fill="#fff" fill-opacity=".07"/>
    </pattern>
    <linearGradient id="arc" x1="0" x2="1">
      <stop offset="0" stop-color="#3d6bff"/>
      <stop offset="1" stop-color="#ff7a3d"/>
    </linearGradient>
    <clipPath id="card"><rect width="880" height="200" rx="18"/></clipPath>
    <style>
      .sans { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Helvetica Neue", Helvetica, Arial, sans-serif; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
      .flow { stroke-dasharray: 2 9; animation: flow 1.6s linear infinite; }
      .ping { animation: ping 2.4s ease-out infinite; transform-origin: 760px 112px; }
      @keyframes flow { to { stroke-dashoffset: -22 } }
      @keyframes ping { from { transform: scale(.6); opacity: .9 } to { transform: scale(2.6); opacity: 0 } }
      @media (prefers-reduced-motion: reduce) { .flow, .ping { animation: none } }
    </style>
  </defs>
  <g clip-path="url(#card)">
    <rect width="880" height="200" fill="#050505"/>
    <rect width="880" height="200" fill="url(#dots)"/>

        <text x="440" y="40" text-anchor="middle" class="mono" font-size="12" letter-spacing="1" fill="#8e8e93">9,029 KM</text>

    <path class="flow" d="M120 112 C 300 40, 580 40, 760 112" fill="none" stroke="url(#arc)" stroke-width="2"/>

    <circle cx="120" cy="112" r="5" fill="#3d6bff"/>
    <circle class="ping" cx="760" cy="112" r="6" fill="none" stroke="#ff7a3d" stroke-width="1.5"/>
    <circle cx="760" cy="112" r="5" fill="#ff7a3d"/>

    <text x="120" y="146" text-anchor="middle" class="sans" font-size="15" font-weight="600" fill="#f5f5f7">Daejeon · Seoul</text>
    <text x="120" y="166" text-anchor="middle" class="mono" font-size="11" fill="#636366">NOW</text>
    <text x="760" y="146" text-anchor="middle" class="sans" font-size="15" font-weight="600" fill="#f5f5f7">San Francisco</text>
    <text x="760" y="166" text-anchor="middle" class="mono" font-size="11" fill="#636366">NEXT · THIS YEAR (GOAL)</text>

    <text x="440" y="186" text-anchor="middle" class="sans" font-size="12" fill="#8e8e93">I am starting my company in Silicon Valley.</text>
  </g>
  <rect x=".5" y=".5" width="879" height="199" rx="18" fill="none" stroke="#fff" stroke-opacity=".08"/>
</svg>
