<svg xmlns="http://www.w3.org/2000/svg" width="880" height="230" viewBox="0 0 880 230" role="img" aria-labelledby="t">
  <title id="t">Field notes. Say less, ship more. The best survey is a payment. Perfectionism is not skill, it is self-censorship.</title>
  <defs>
    <linearGradient id="silver" x1="0" x2="1">
      <stop offset="0" stop-color="#eceef1"/><stop offset=".36" stop-color="#c9ccd1"/><stop offset=".68" stop-color="#a7abb3"/><stop offset="1" stop-color="#dcdee2"/>
    </linearGradient>
    <linearGradient id="goldLine" x1="0" x2="1">
      <stop offset="0" stop-color="#e9c46a"/><stop offset="1" stop-color="#e9c46a" stop-opacity="0"/>
    </linearGradient>
    <style>
      .sans { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Helvetica Neue", Helvetica, Arial, sans-serif; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
      .tile { opacity: 0; animation: swing 1s cubic-bezier(.28,.11,.32,1) forwards; }
      @keyframes swing { from { opacity: 0; transform: translateY(22px) } to { opacity: 1; transform: none } }
      .t2 { animation-delay: .25s } .t3 { animation-delay: .5s }
      .draw { stroke-dasharray: 240; stroke-dashoffset: 240; animation: draw 1.4s cubic-bezier(.28,.11,.32,1) forwards; }
      @keyframes draw { to { stroke-dashoffset: 0 } }
      .w1 { animation-delay: .5s } .w2 { animation-delay: .75s } .w3 { animation-delay: 1s }
      @media (prefers-reduced-motion: reduce) { .tile { animation: none; opacity: 1 } .draw { animation: none; stroke-dashoffset: 0 } }
    </style>
  </defs>

  <g class="tile">
    <rect x=".5" y=".5" width="279" height="229" rx="20" fill="#141415" stroke="#fff" stroke-opacity=".1"/>
    <line class="draw w1" x1="24" y1="1" x2="264" y2="1" stroke="url(#goldLine)" stroke-width="1.5"/>
    <text x="24" y="42" class="mono" font-size="11" letter-spacing="2" fill="#8b8b90">FIELD NOTE 01</text>
    <text x="24" y="104" class="sans" font-size="27" font-weight="700" letter-spacing="-.7" fill="#f5f5f7">Say less,</text>
    <text x="24" y="138" class="sans" font-size="27" font-weight="700" letter-spacing="-.7" fill="url(#silver)">ship more.</text>
    <text x="24" y="204" class="sans" font-size="12" fill="#86868b">Genspark × Bloom × ARK Point</text>
  </g>

  <g class="tile t2">
    <rect x="300.5" y=".5" width="279" height="229" rx="20" fill="#141415" stroke="#fff" stroke-opacity=".1"/>
    <line class="draw w2" x1="324" y1="1" x2="564" y2="1" stroke="url(#goldLine)" stroke-width="1.5"/>
    <text x="324" y="42" class="mono" font-size="11" letter-spacing="2" fill="#8b8b90">FIELD NOTE 02</text>
    <text x="324" y="104" class="sans" font-size="27" font-weight="700" letter-spacing="-.7" fill="#f5f5f7">The best survey</text>
    <text x="324" y="138" class="sans" font-size="27" font-weight="700" letter-spacing="-.7" fill="url(#silver)">is a payment.</text>
    <text x="324" y="204" class="sans" font-size="12" fill="#86868b">Bloom × Peter Shin × Airwallex</text>
  </g>

  <g class="tile t3">
    <rect x="600.5" y=".5" width="279" height="229" rx="20" fill="#141415" stroke="#fff" stroke-opacity=".1"/>
    <line class="draw w3" x1="624" y1="1" x2="864" y2="1" stroke="url(#goldLine)" stroke-width="1.5"/>
    <text x="624" y="42" class="mono" font-size="11" letter-spacing="2" fill="#8b8b90">FIELD NOTE 03</text>
    <text x="624" y="104" class="sans" font-size="27" font-weight="700" letter-spacing="-.7" fill="#f5f5f7">Perfectionism</text>
    <text x="624" y="138" class="sans" font-size="27" font-weight="700" letter-spacing="-.7" fill="#f5f5f7">isn't skill.</text>
    <text x="624" y="172" class="sans" font-size="27" font-weight="700" letter-spacing="-.7" fill="url(#silver)">It's self-censorship.</text>
    <text x="624" y="204" class="sans" font-size="12" fill="#86868b">Bloom × Peter Shin × Airwallex</text>
  </g>
</svg>
